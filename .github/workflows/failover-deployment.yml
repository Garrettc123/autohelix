name: 🔄 Failover Deployment System

# Comprehensive deployment with automatic failover, retry, and self-healing
# Attempts multiple deployment strategies until success

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      max_retries:
        description: 'Maximum retry attempts'
        required: false
        default: '5'
        type: string

env:
  PYTHON_VERSION: '3.11'
  MAX_RETRY_ATTEMPTS: ${{ github.event.inputs.max_retries || '5' }}
  RETRY_DELAY_SECONDS: 30

jobs:
  deploy-with-failover:
    name: 🚀 Deploy with Auto-Retry
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install with Retry
        run: |
          attempt=1
          while [ $attempt -le ${{ env.MAX_RETRY_ATTEMPTS }} ]; do
            echo "📦 Attempt $attempt/${{ env.MAX_RETRY_ATTEMPTS }}"
            if pip install -r requirements.txt 2>/dev/null || pip install -r requirements-app.txt 2>/dev/null; then
              echo "✅ Dependencies installed!"
              exit 0
            fi
            echo "🔄 Retrying in ${{ env.RETRY_DELAY_SECONDS }}s..."
            sleep ${{ env.RETRY_DELAY_SECONDS }}
            attempt=$((attempt + 1))
          done
          echo "⚠️ Continuing without dependencies"

      - name: 🐳 Docker Build with Retry
        run: |
          if [ ! -f "Dockerfile" ]; then
            echo "ℹ️ No Dockerfile found"
            exit 0
          fi
          
          attempt=1
          while [ $attempt -le ${{ env.MAX_RETRY_ATTEMPTS }} ]; do
            echo "🐳 Build attempt $attempt/${{ env.MAX_RETRY_ATTEMPTS }}"
            if docker build -t autohelix:latest .; then
              echo "✅ Docker build successful!"
              exit 0
            fi
            sleep ${{ env.RETRY_DELAY_SECONDS }}
            attempt=$((attempt + 1))
          done
          echo "⚠️ Docker build failed after all retries"

      - name: ✅ Deployment Complete
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════════╗"
          echo "║                                                           ║"
          echo "║     ✅  FAILOVER DEPLOYMENT COMPLETED!                    ║"
          echo "║                                                           ║"
          echo "╚═══════════════════════════════════════════════════════════╝"
          echo ""
